    <path fill="#f6d32d" d="M6 114l10-10h8l-10 10zm16 0 10-10h8l-10 10zm16 0 10-10h8l-10 10zm16 0 10-10h8l-10 10zm16 0 10-10h8l-10 10zm16 0 10-10h8l-10 10zm16 0 10-10h8l-10 10z"/>
