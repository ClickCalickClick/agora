  <!-- Roof -->
  <path fill="#c9b48c" d="M64 10 116 36v6H12v-6z"/>
  <path fill="#e8dcc4" d="M64 17 101 36H27z"/>
  <!-- Facade -->
  <rect x="14" y="40" width="100" height="56" rx="4" fill="#e8dcc4"/>
  <rect x="14" y="40" width="100" height="6" rx="2" fill="#d8c7a4"/>
  <!-- Speech bubble opening -->
  <path fill="#1f4e4f" d="M36 52h56a12 12 0 0 1 12 12v12a12 12 0 0 1-12 12H52l-18 10 4-10h-2a12 12 0 0 1-12-12V64a12 12 0 0 1 12-12z"/>
  <path fill="#2b6463" d="M36 52h56a12 12 0 0 1 12 12v2H24v-2a12 12 0 0 1 12-12z"/>
