# CI per SPEC §19. Rust checks run on Arch Linux (same GTK, libadwaita and
# WebKitGTK versions as the target runtime); the Flatpak job builds against
# the GNOME 51 SDK.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  checks:
    name: fmt, clippy, tests, data validation
    runs-on: ubuntu-latest
    # Arch Linux ships the target versions (GTK 4.24, libadwaita 1.10,
    # WebKitGTK 6.0) as system packages, so the Rust checks run natively.
    # The Flatpak job below builds against the GNOME 51 SDK itself.
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita webkitgtk-6.0 \
            blueprint-compiler meson appstream desktop-file-utils python
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-arch-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-arch-

      - name: WebKitGTK 6.0 is available
        run: pkg-config --modversion webkitgtk-6.0

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # Store tests use GObjects and in-memory GSettings only; no display.
        run: cargo test --workspace

      - name: Meson build and tests (appstreamcli, desktop-file-validate, schema, POTFILES)
        run: |
          meson setup _build -Dprofile=development
          meson compile -C _build
          meson test -C _build --print-errorlogs

  cargo-sources:
    name: Generate cargo-sources.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install aiohttp tomlkit toml
          curl -fsSL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: cargo-sources.json
          retention-days: 1

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  gitleaks:
    name: gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    name: Flatpak build (Devel manifest)
    needs: cargo-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: build-aux

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: agora-devel.flatpak
          manifest-path: build-aux/io.github.ClickCalickClick.Agora.Devel.json
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          # Agora publishes no bundles (SPEC §18).
          upload-artifact: false
